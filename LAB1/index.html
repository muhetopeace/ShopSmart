<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSmart - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans">
    <!-- Navbar -->
    <nav class="bg-white shadow-md fixed w-full top-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="#" class="text-2xl font-bold text-primary">ShopSmart</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="#" class="text-gray-400 hover:text-primary">Home</a>
                    <a href="#" class="text-gray-700 hover:text-primary">Wishlist</a>
                    <a href="#" class="text-gray-700 hover:text-primary">About</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class=" text-white text-center py-20 mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl sm:text-4xl font-bold mb-4">Discover Amazing Products</h1>
            <p class="text-lg sm:text-xl">Browse our curated collection</p>
        </div>
    </header>

    <!-- Product Grid -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Placeholder Product Cards -->
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="h-48 bg-gray-200"></div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold mb-2">Product 1</h3>
                    <p class="text-gray-600">$29.99</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="h-48 bg-gray-200"></div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold mb-2">Product 2</h3>
                    <p class="text-gray-600">$39.99</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="h-48 bg-gray-200"></div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold mb-2">Product 3</h3>
                    <p class="text-gray-600">$49.99</p>
                </div>
            </div>
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="h-48 bg-gray-200"></div>
                <div class="p-4">
                    <h3 class="text-lg font-semibold mb-2">Product 4</h3>
                    <p class="text-gray-600">$59.99</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-pink-600 shadow-md py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p>&copy; 2025 ShopSmart. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
