<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSmart - Wishlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366F1',
            secondary: '#14B8A6',
            accent: '#F59E0B',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans">
    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-primary to-secondary shadow-md fixed w-full top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="index.html" class="text-2xl font-bold text-primary">ShopSmart</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" class="text-gray-700 hover:text-primary">Home</a>
                    <a href="wishlist.html" class="text-gray-700 hover:text-primary relative">
                        Wishlist
                        <span id="wishlistCounter" class="absolute -top-2 -right-4 bg-secondary text-white text-xs rounded-full px-2 py-1"></span>
                    </a>
                    <a href="about.html" class="text-gray-700 hover:text-primary">About</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Wishlist Section -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 mt-16">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold">Your Wishlist</h1>
            <button id="clearWishlist" class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-gray-500 transition-colors">Clear All</button>
        </div>
        <div id="wishlistGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
        <div id="emptyWishlist" class="text-center hidden">
            <p class="text-xl text-gray-600">Your wishlist is empty</p>
        </div>
    </section>

<!-- Font Awesome for icons -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

<!-- Footer -->
<footer class="bg-gradient-to-r from-primary to-secondary text-white py-4 w-full fixed bottom-0 left-0">
  <div class="flex justify-center space-x-6">
    <a
      href="https://instagram.com/__pe.ace02"
      target="_blank"
      class="hover:text-pink-400 transition"
    >
      <i class="fab fa-instagram text-2xl"></i>
    </a>

    <a
      href="https://github.com/muhetopeace"
      target="_blank"
      class="hover:text-gray-400 transition"
    >
      <i class="fab fa-github text-2xl"></i>
    </a>
  </div>

  <p class="text-center text-sm mt-2">
    © 2025 Muheto Peace. All rights reserved.
  </p>
</footer>



    <script type="module" src="wishlist.js"></script>
    <script type="module">
        import { getWishlist, removeFromWishlist, displayWishlist, clearWishlist } from './wishlist.js';

        const wishlistGrid = document.getElementById('wishlistGrid');
        const emptyWishlist = document.getElementById('emptyWishlist');
        const clearWishlistButton = document.getElementById('clearWishlist');
        const wishlistCounter = document.getElementById('wishlistCounter');

        function renderWishlist() {
            const wishlist = getWishlist();
            displayWishlist(wishlist, wishlistGrid, emptyWishlist);
            wishlistCounter.textContent = wishlist.length || '';
            wishlistCounter.classList.toggle('hidden', wishlist.length === 0);
        }

        wishlistGrid.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON' && e.target.dataset.id) {
                removeFromWishlist(e.target.dataset.id);
                renderWishlist();
            }
        });

        clearWishlistButton.addEventListener('click', () => {
            clearWishlist();
            renderWishlist();
        });

        renderWishlist();
    </script>
</body>
</html>
