<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopSmart - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366F1',
            secondary: '#14B8A6',
            accent: '#F59E0B',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="bg-gradient-to-b from-gray-100 via-white to-gray-200 font-sans text-gray-800">
  <!-- Navbar -->
  <nav class="bg-gradient-to-r from-primary to-secondary shadow-lg fixed w-full top-0 z-10 text-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <a href="index.html" class="text-2xl font-bold">ShopSmart</a>
        <div class="flex space-x-6">
          <a href="index.html" class="hover:text-accent">Home</a>
          <a href="wishlist.html" class="hover:text-accent">Wishlist</a>
          <a href="about.html" class="hover:text-accent">About</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="text-center py-24 mt-12 bg-gradient-to-r from-primary to-secondary text-white">
    <h1 class="text-4xl font-extrabold mb-3">Discover Amazing Products</h1>
    <p class="text-lg">Browse, search, and save your favorites with ShopSmart</p>
    <a href="#productGrid" class="mt-6 inline-block bg-accent text-white px-6 py-3 rounded-lg font-semibold hover:opacity-90 transition">Start Exploring</a>
  </header>

  <!-- Search and Filter -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-4">
      <input type="text" id="searchInput" placeholder="Search products..." class="flex-1 px-4 py-2 border rounded-md shadow-sm" />
      <select id="categoryFilter" class="px-4 py-2 border rounded-md shadow-sm">
        <option value="">All Categories</option>
      </select>
    </div>
  </section>

  <!-- Product Grid -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="loadingSpinner" class="text-center hidden">
      <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-primary mx-auto"></div>
      <p class="mt-2 text-gray-700">Loading products...</p>
    </div>
    <div id="noResults" class="text-center hidden">
      <p class="text-xl text-gray-600">No results found</p>
    </div>
    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
  </section>
<!-- Font Awesome for icons -->
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>

<!-- Footer -->
<footer class="bg-gradient-to-r from-primary to-secondary text-white py-4 w-full fixed bottom-0 left-0">
  <div class="flex justify-center space-x-6">
    <a
      href="https://instagram.com/__pe.ace02"
      target="_blank"
      class="hover:text-pink-400 transition"
    >
      <i class="fab fa-instagram text-2xl"></i>
    </a>

    <a
      href="https://github.com/muhetopeace"
      target="_blank"
      class="hover:text-gray-400 transition"
    >
      <i class="fab fa-github text-2xl"></i>
    </a>
  </div>

  <p class="text-center text-sm mt-2">
    © 2025 Muheto Peace. All rights reserved.
  </p>
</footer>

  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Scripts -->
  <script type="module" src="fetchProducts.js"></script>
  <script type="module" src="wishlist.js"></script>
  <script type="module">
    import { fetchProducts, fetchCategories } from "./fetchProducts.js";
    import { addToWishlist, isInWishlist } from "./wishlist.js";

    const productGrid = document.getElementById("productGrid");
    const loadingSpinner = document.getElementById("loadingSpinner");
    const noResults = document.getElementById("noResults");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    let allProducts = [];

    async function loadProducts() {
      loadingSpinner.classList.remove("hidden");
      productGrid.innerHTML = "";
      noResults.classList.add("hidden");

      try {
        allProducts = await fetchProducts();
        populateCategories();
        displayProducts(allProducts);
      } catch (error) {
        noResults.classList.remove("hidden");
        noResults.innerHTML = '<p class="text-xl text-red-600">Error loading products. Please try again.</p>';
      } finally {
        loadingSpinner.classList.add("hidden");
      }
    }

    function populateCategories() {
      fetchCategories().then((categories) => {
        categories.forEach((cat) => {
          const option = document.createElement("option");
          option.value = cat;
          option.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
          categoryFilter.appendChild(option);
        });
      });
    }

    function displayProducts(products) {
      productGrid.innerHTML = "";
      if (products.length === 0) {
        noResults.classList.remove("hidden");
        return;
      }
      products.forEach((product) => {
        const card = document.createElement("div");
        card.className = "bg-white rounded-lg shadow-md overflow-hidden transform hover:scale-105 transition";
        card.innerHTML = `
          <img src="${product.image}" alt="${product.title}" class="w-full h-48 object-contain p-4">
          <div class="p-4">
            <h3 class="text-lg font-semibold mb-2">${product.title}</h3>
            <p class="text-gray-600 mb-2">$${product.price.toFixed(2)}</p>
            <button class="w-full bg-secondary text-white py-2 rounded-md hover:bg-green-700" data-id="${product.id}">
              ${isInWishlist(product.id) ? "Remove from Wishlist" : "Add to Wishlist"}
            </button>
          </div>`;
        const button = card.querySelector("button");
        button.addEventListener("click", () => {
          addToWishlist(product);
          button.textContent = isInWishlist(product.id)
            ? "Remove from Wishlist"
            : "Add to Wishlist";
        });
        productGrid.appendChild(card);
      });
    }

    function filterProducts() {
      const searchTerm = searchInput.value.toLowerCase();
      const category = categoryFilter.value.toLowerCase();
      const filtered = allProducts.filter((product) => {
        const matchesSearch = product.title.toLowerCase().includes(searchTerm);
        const matchesCategory = category ? product.category.toLowerCase() === category : true;
        return matchesSearch && matchesCategory;
      });
      displayProducts(filtered);
    }

    searchInput.addEventListener("input", filterProducts);
    categoryFilter.addEventListener("change", filterProducts);

    loadProducts();
  </script>
</body>
</html>
